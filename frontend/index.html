<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hornet</title>
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>

<header id="top-bar">
  <div class="top-bar-logo">
    <span class="logo-icon">⬡</span>
    <span class="logo-text">HOR<strong>NET</strong></span>
  </div>
  <button id="menu-toggle" aria-label="Apri menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div id="sidebar-overlay"></div>

<div id="app-wrapper">

  <nav id="sidebar">
    <div class="logo">
      <span class="logo-icon">⬡</span>
      <span class="logo-text">HOR<strong>NET</strong></span>
    </div>
    <ul class="nav-links">
      <li><a href="#" class="nav-item active" data-page="shortcuts">
        <span class="nav-icon">⇢</span> Scorciatoie
      </a></li>
      <li><a href="#" class="nav-item" data-page="docker">
        <span class="nav-icon">◈</span> Docker
      </a></li>
      <li><a href="#" class="nav-item" data-page="tailscale">
        <span class="nav-icon">◎</span> VPN / Hosts
      </a></li>
      <li><a href="#" class="nav-item" data-page="resources">
        <span class="nav-icon">▦</span> Risorse
      </a></li>
    </ul>
    <div class="sidebar-footer">
      <span id="clock"></span>
    </div>
  </nav>

  <main id="content">
    <div id="page-shortcuts"  class="page active"></div>
    <div id="page-docker"     class="page"></div>
    <div id="page-tailscale"  class="page"></div>
    <div id="page-resources"  class="page"></div>
  </main>

</div>

<!-- Modal log container -->
<div id="log-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-header">
      <span id="log-title">Logs</span>
      <button id="log-close">✕</button>
    </div>
    <pre id="log-content"></pre>
  </div>
</div>

<!-- Modal log container/compose -->
<div id="log-output-modal" class="modal hidden">
  <div class="modal-box log-output-box">
    <div class="modal-header">
      <span id="log-output-title">Logs</span>
      <button id="log-output-close">✕</button>
    </div>
    <pre id="log-output-content"></pre>
  </div>
</div>

<!-- Modal aggiunta scorciatoia -->
<div id="shortcut-modal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-header">
      <span>Nuova scorciatoia</span>
      <button id="shortcut-modal-close">✕</button>
    </div>
    <div class="form-group">
      <label>Nome</label>
      <input id="sc-name" type="text" placeholder="Home Assistant" />
    </div>
    <div class="form-group">
      <label>URL</label>
      <input id="sc-url" type="text" placeholder="http://192.168.1.10:8123" />
    </div>
    <div class="form-group">
      <label>Icona (emoji)</label>
      <input id="sc-icon" type="text" placeholder="🏠" maxlength="4" />
    </div>
    <button id="sc-save" class="btn-primary">Aggiungi</button>
  </div>
</div>

<!-- Modal confirm/prompt generico -->
<div id="dialog-modal" class="modal hidden">
  <div class="modal-box small">
    <div class="modal-header">
      <span id="dialog-title"></span>
      <button id="dialog-cancel-x">✕</button>
    </div>
    <div style="padding:16px">
      <div id="dialog-message" style="font-size:12px;color:var(--text);margin-bottom:12px"></div>
      <input id="dialog-input" type="text" style="
        display:none; width:100%; padding:8px 10px; background:var(--bg);
        border:1px solid var(--border); border-radius:var(--radius);
        color:var(--text); font-family:var(--font-mono); font-size:12px;
        margin-bottom:12px;
      "/>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn" id="dialog-cancel">Annulla</button>
        <button class="btn btn-primary" id="dialog-confirm" style="width:auto;margin:0">Conferma</button>
      </div>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/shortcuts.js"></script>
<script src="js/docker.js"></script>
<script src="js/tailscale.js"></script>
<script src="js/resources.js"></script>
<script src="js/app.js"></script>
</body>
</html>
